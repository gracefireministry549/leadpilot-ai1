name: LeadPilot CI

on:
  push:
    branches: [main, 'codex/**', 'fix/**', 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leadpilot-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leadpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d leadpilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies without requiring a lockfile
        run: npm install --no-package-lock
      - name: Report dependency advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); console.log('Dependency advisories:', JSON.stringify(a.metadata?.vulnerabilities ?? {})); for (const [name, item] of Object.entries(a.vulnerabilities ?? {})) console.log(name + ': ' + item.severity + ' | fix: ' + JSON.stringify(item.fixAvailable));"
      - name: Validate Python worker
        working-directory: services/python-agents
        run: |
          python -m py_compile service.py general_manager.py general_manager_route.py
          python -m unittest discover -s . -p 'test_*.py' -v
      - name: Validate payment, outreach and RLS migrations on disposable Postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -d leadpilot_test -v ON_ERROR_STOP=1 -f supabase/tests/migration_contract_setup.sql
          psql -h localhost -U postgres -d leadpilot_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261115140000_currency_minor_units.sql
          psql -h localhost -U postgres -d leadpilot_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261115150000_atomic_outreach_execution.sql
          psql -h localhost -U postgres -d leadpilot_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261115160000_same_company_relationship_guards.sql
          psql -h localhost -U postgres -d leadpilot_test -v ON_ERROR_STOP=1 -f supabase/tests/migration_contract_assertions.sql
      - name: Validate complete company-based fresh-install migration chain
        run: |
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE leadpilot_fresh_install"
          psql -h localhost -U postgres -d leadpilot_fresh_install -v ON_ERROR_STOP=1 -f supabase/tests/fresh_install_setup.sql
          for migration in \
            supabase/migrations/20261104210000_company_command_center_foundation.sql \
            supabase/migrations/20261104220000_company_role_based_rls_hardening.sql \
            supabase/migrations/20261104230000_rls_policy_cleanup.sql \
            supabase/migrations/20261104233000_profile_creation_auth_trigger.sql \
            supabase/migrations/20261104240000_existing_features_company_compatibility.sql \
            supabase/migrations/20261104250000_private_service_policies_and_indexes.sql \
            supabase/migrations/20261104251000_grant_private_service_access.sql \
            supabase/migrations/20261113120000_agent_sessions_memory.sql \
            supabase/migrations/20261115120000_atomic_paystack_webhook.sql \
            supabase/migrations/20261115130000_rls_insert_state_guards.sql \
            supabase/migrations/20261115140000_currency_minor_units.sql \
            supabase/migrations/20261115150000_atomic_outreach_execution.sql \
            supabase/migrations/20261115160000_same_company_relationship_guards.sql \
            supabase/migrations/20261116150431_private_user_file_storage.sql \
            supabase/migrations/20261116152201_file_objects_user_created_index.sql; do
            psql -h localhost -U postgres -d leadpilot_fresh_install -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -h localhost -U postgres -d leadpilot_fresh_install -v ON_ERROR_STOP=1 -f supabase/tests/fresh_install_assertions.sql
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Validation complete
        run: echo "LeadPilot CI reached the final validation stage"
