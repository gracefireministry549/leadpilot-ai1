name: LeadPilot CI

on:
  push:
    branches: [main, 'codex/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leadpilot-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies without requiring a lockfile
        run: npm install --no-package-lock
      - name: Report dependency advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); console.log('Dependency advisories:', JSON.stringify(a.metadata?.vulnerabilities ?? {})); for (const [name, item] of Object.entries(a.vulnerabilities ?? {})) console.log(name + ': ' + item.severity + ' | fix: ' + JSON.stringify(item.fixAvailable));"
      - name: Validate Python worker
        working-directory: services/python-agents
        run: |
          python -m py_compile service.py general_manager.py general_manager_route.py
          python -m unittest discover -s . -p 'test_*.py' -v
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Validation complete
        run: echo "LeadPilot CI reached the final validation stage"
