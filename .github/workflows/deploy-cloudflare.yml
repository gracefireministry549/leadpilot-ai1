name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test
      - name: Build for Cloudflare Workers
        # NEXT_PUBLIC_* values are inlined into the browser bundle at build time.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://nktsdsdmdnhintykjiiu.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ivwyjTf8EPmsyqjy6rAh-g_3e3bhZ13' }}
        run: npm run cf:build
      - name: Bundle the Worker into a single deployable file
        run: npx wrangler deploy --dry-run --outdir cf-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: cf-worker
          path: cf-bundle
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: cf-assets
          path: .open-next/assets
          retention-days: 7
      - name: Deploy
        # Pull requests only prove the Cloudflare build works; they never deploy.
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
