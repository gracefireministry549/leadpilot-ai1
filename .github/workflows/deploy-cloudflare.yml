name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test
      - name: Validate production Supabase configuration
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY repository secret" && exit 1)
      - name: Build for Cloudflare Workers
        # These are public Supabase client values and match .env.example; they are not secrets.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://crkwzloblmdvqzckwhdm.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_vt8fkKjx24J74tjZdhP9Sg_f-7EdQQ7' }}
        run: npm run cf:build
      - name: Bundle the Worker into a single deployable file
        run: npx wrangler deploy --dry-run --outdir cf-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: cf-worker
          path: cf-bundle
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: cf-assets
          path: .open-next/assets
          retention-days: 7
      - name: Deploy with server-only Supabase secret
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e 'const fs = require("node:fs"); const value = process.env.SUPABASE_SERVICE_ROLE_KEY; if (!value) throw new Error("SUPABASE_SERVICE_ROLE_KEY is required"); fs.writeFileSync(".secrets.json", JSON.stringify({ SUPABASE_SERVICE_ROLE_KEY: value }), { mode: 0o600 });'
          npx wrangler deploy --secrets-file .secrets.json
          rm -f .secrets.json
